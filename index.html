<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Master</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Trivia Master</h1>
        <p>Mostre que você é um mestre dos conhecimentos gerais!</p>
        <button id="btn-tema" aria-label="Alternar modo escuro" class="btn-tema">🌙 Alternar Tema</button>
    </header>

    <main>
        <div id="mensagem-erro" style="display: none; background: #ffeaa7; color: #d63031; padding: 1rem; border-radius: 4px; font-weight: bold; text-align: center; width: 100%; max-width: 600px;"></div>

        <section class="card config-section">
            <h2>Configurar Partida</h2>
            <form id="form-config">
                <div class="form-group">
                    <label for="nome">Seu Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                </div>
                
                <div class="form-group">
                    <label for="tema">Escolha o Tema:</label>
                    <select id="tema" name="tema" required>
                        <option value="">Selecione...</option>
                        <option value="9">Conhecimentos Gerais</option>
                        <option value="21">Esportes</option>
                        <option value="11">Cinema</option>
                        <option value="15">Videogames</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Iniciar Quiz</button>
            </form>
        </section>

        <section class="card quiz-section" style="display: none;">
            <div class="quiz-status">
                <span>Pergunta 1/10</span>
                <span>Pontos: 0</span>
            </div>
            <h3 class="pergunta"></h3>
            <!-- R3: Lista limpa, gerada pelo JS -->
            <div class="alternativas-grid"></div>
        </section>

        <section class="card ranking-section">
            <h2>🏆 Top 5 Jogadores</h2>
            <!-- R3: Lista limpa, gerada pelo JS -->
            <ul class="ranking-lista"></ul>
        </section>
    </main>

    <footer>
        <p>Projeto Integrador - Programação para Web II</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
